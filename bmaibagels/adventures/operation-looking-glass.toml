version = 1

[adventure]
slug = "operation-looking-glass"
name = "OPERATION LOOKING GLASS"
thread_id = 1368
bot_player = "BMAIBagels"
acceptance_command = "I accept"
# global: nobody may repeat a button
# player: each player may use a button once, but other players may reuse it
# none: no button-history restriction
button_uniqueness = "player"

[entry]
# Closed to new assignments; missions already accepted play on.
submissions_close_at = "2026-10-06T18:13:00Z"

[eligibility]
# The lower boundary is inclusive; the upper boundary is exclusive.
# minimum_win_rate is intentionally omitted: very weak buttons are welcome.
maximum_win_rate = 60.0
require_published_win_rate = true
require_bot_readable = true
supported_button_exceptions = ["Echo"]
win_rate_allowlist = "operation_looking_glass_oz_button_name"
button_filter_url = "http://buttonmen.s3-website-us-east-1.amazonaws.com/ButtonFilter.html"

[runtime]
credentials_file = "../.bmrc"
credentials_site = "bmaibagels"
buttonmen_tools_dir = "../.."
state_directory = "../.adventure-state"
sleep_seconds = 120

[leaderboard]
enabled = true
post_id = 33723
group_by_opponent = true

[compatibility]
# Imports the standardized mission records already present in thread 1368.
# Any mission later edited by watchadventure.py is rewritten as V1 JSON state.
import_looking_glass_v2 = true

[[fights]]
opponent_button = "Tweedledum+dee"
label = "Tweedledum+dee"
emoji = "👯"

[[fights]]
opponent_button = "Mad Hatter"
label = "Mad Hatter"
emoji = "🎩"

[[fights]]
opponent_button = "White Rabbit"
label = "White Rabbit"
emoji = "🐇"

[[fights]]
opponent_button = "Queen Of Hearts"
label = "Queen Of Hearts"
emoji = "♥️"

[[fights]]
opponent_button = "The Jabberwock"
label = "The Jabberwock"
emoji = "🐉"

[[fights]]
opponent_button = "Alice"
label = "Alice"
emoji = "👧"

[templates]
mission_header = "[MISSION: {player} - {button}]"
journey_title = "{player}'s OPERATION LOOKING GLASS journey"
champion_line = "Champion: {button}"
accepted_from_line = "Accepted from: {source_post_link}"
fight_line = "Fight {fight_number}/{fight_count} — {opponent}: [game={game_id}] — {fight_result_display}"
creating_conclusion = "Assignment accepted. Preparing fight 1/{fight_count}."
active_conclusion = "The quest continues."
survived_conclusion = "The champion defeated Alice and survived OPERATION LOOKING GLASS."
failed_conclusion = "The champion was lost to {defeated_by}. This quest has ended in failure."
game_description = "OPERATION LOOKING GLASS FIGHT {fight_number}/{fight_count}"
rejection_post = """
{player}, this assignment cannot be accepted.

{reason}.

Acceptance: {source_post_link}

Please use one of these formats with an exact published button name:
[code]I accept [button=Aylee]
I accept Aylee[/code]

Select a champion using the current Button Filter publication.

{button_filter_url}
"""
leaderboard_title = "[b]OPERATION LOOKING GLASS — COMMUNITY LEADERBOARD[/b]"
leaderboard_intro = "Columns: opponents defeated / rounds lost / points scored. Ranked by opponents defeated, then fewest rounds lost, then most points scored."
leaderboard_empty = "No completed missions yet."
leaderboard_entry = "{rank}. {player} — {button} — {opponents_defeated}F/{rounds_lost}L/{points_scored:g}pts — {outcome}"
