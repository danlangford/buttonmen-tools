version = 1

# Adventure idea and fight order by TheOrgg.

[adventure]
slug = "operation-my-little-pwonies"
name = "OPERATION MY LITTLE PWON-IES"
thread_id = 1385
bot_player = "BMAIBagels"
button_uniqueness = "player"

[entry]
# A completed game against BMAIBagels playing Rainbow Dash is both the entry
# and fight 1.
mode = "completed_game"
games_created_after = "2026-11-24"
target_wins = 3
show_ineligible_games = true

[eligibility]
maximum_win_rate = 60.0
require_published_win_rate = true
require_bot_readable = true
supported_button_exceptions = []
win_rate_allowlist = "operation_looking_glass_oz_button_name"
button_filter_url = "http://buttonmen.s3-website-us-east-1.amazonaws.com/ButtonFilter.html"

[runtime]
credentials_file = "../.bmrc"
credentials_site = "bmaibagels"
buttonmen_tools_dir = "../.."
state_directory = "../.adventure-state"
sleep_seconds = 120

[leaderboard]
enabled = true
post_id = 34824
group_by_opponent = true

[compatibility]
import_looking_glass_v2 = false

[[fights]]
opponent_button = "Rainbow Dash"
label = "Rainbow Dash"
emoji = "🌈"
description = "Rainbow Dash challenges you to a race across the sky. Keep up, or get left behind in the clouds."

[[fights]]
opponent_button = "Rarity"
label = "Rarity"
emoji = "💎"
description = "Rarity insists you look fabulous before any fight. Survive the fitting room."

[[fights]]
opponent_button = "Pinkie Pie"
label = "Pinkie Pie"
emoji = "🎉"
description = "Pinkie Pie threw you a surprise party. The surprise is that it's a brawl."

[[fights]]
opponent_button = "Parasprites"
label = "Parasprites"
emoji = "🐞"
description = "The parasprites are eating everything in Ponyville, and there are more every minute. Stop the swarm."

[[fights]]
opponent_button = "Chrysalis"
label = "Chrysalis"
emoji = "👑"
description = "The Changeling Queen has come to feed on Ponyville's love. Don't let her have a single bite."

[[fights]]
opponent_button = "Changeling (BP)"
label = "Changeling"
emoji = "🦗"
description = "The hive can look like anypony. Trust no one and fight everyone."

[[fights]]
opponent_button = "Angel (BP)"
label = "Angel"
emoji = "🐰"
description = "Fluttershy's bunny is small, fluffy, and absolutely furious. Whatever you do, don't touch the tail."

[[fights]]
opponent_button = "Applejack"
label = "Applejack"
emoji = "🍎"
description = "Applejack has watched the whole journey from the orchard. Earn her honest respect in the final showdown."

[templates]
game_description = "OPERATION MY LITTLE PWON-IES FIGHT {fight_number}/{fight_count} | ENTRY GAME {entry_game_id}"
leaderboard_title = "[b]OPERATION MY LITTLE PWON-IES 🦄 — COMMUNITY LEADERBOARD[/b]"
leaderboard_intro = "Columns: ponies pwned / rounds lost / points scored. Ranked by ponies pwned, then fewest rounds lost, then most points scored. Entry begins by completing a first-to-3 game against BMAIBagels playing Rainbow Dash."
leaderboard_empty = "No eligible missions have completed the Rainbow Dash entry game yet."
leaderboard_entry = "{rank}. {player} — {button} — {opponents_defeated}F/{rounds_lost}L/{points_scored:g}pts — {outcome}"
leaderboard_ineligible_title = "[b]INELIGIBLE ENTRY GAMES[/b]"
leaderboard_ineligible_entry = "[game={game_id}] {player} — {button} — {reason}"
